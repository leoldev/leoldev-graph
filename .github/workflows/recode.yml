name: art read-back

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC — right before the weekly reset

permissions:
  contents: read

concurrency:
  group: art-verify

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read back GitHub's own per-day contributionLevel vs the design.
      # The actual re-code/reset runs locally (launchd -> weekly-purge.sh):
      # a workflow cannot delete the repository it executes in, and its
      # GITHUB_TOKEN has no delete_repo scope anyway.
      - name: verify rendered levels vs design
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 encode.py --verify
